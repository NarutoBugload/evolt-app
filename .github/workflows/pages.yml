name: Deploy to GitHub Pages

# This repo is static files only, so there is nothing to build - the
# checkout IS the site.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          # Pages serves 404.html for unknown paths; point it at the app so a
          # deep link or refresh lands somewhere useful.
          cp index.html 404.html
          # Stop Jekyll dropping files it doesn't recognise.
          touch .nojekyll
      # enablement turns Pages on via the API on first run, so nobody has to
      # visit Settings before the first deploy. This works here and did not
      # on the private repo: creating a Pages site needs rights GITHUB_TOKEN
      # is only granted on a public one.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
