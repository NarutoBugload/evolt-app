name: Deploy to GitHub Pages

# This repo is static files only, so there is nothing to build - the
# checkout IS the site.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          # Pages serves 404.html for unknown paths; point it at the app so a
          # deep link or refresh lands somewhere useful.
          cp index.html 404.html
          # Stop Jekyll dropping files it doesn't recognise.
          touch .nojekyll
      # Pages must be switched on once, by hand:
      #   Settings > Pages > Build and deployment > Source: GitHub Actions
      # configure-pages has an `enablement: true` option meant to do this via
      # the API, but it fails here with "Create Pages site failed. Error:
      # Resource not accessible by integration" - creating a Pages site needs
      # an administration permission the workflow token is not granted.
      # Tested on both a private and a public repo; visibility makes no
      # difference, so the manual toggle is the only route.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
